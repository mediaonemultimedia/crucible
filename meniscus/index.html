<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meniscus — a dual-render lens study</title>
<meta name="description" content="A standard zoom built from its service schematic, entirely in code: working zoom, focus and iris, a hatched section cut, an exploded view, and two renders of the same object — hyper-real and engineering schematic.">
<style>
:root{
  --ink:#e8e3d8; --dim:#7b8087; --faint:#4a4e54;
  --rule:rgba(232,227,216,.11); --rule-2:rgba(232,227,216,.055);
  --accent:#c8a877;
  --page-ink:#e9e6df; --page-dim:rgba(233,230,223,.5); --lead:rgba(233,230,223,.55);
  --sans:"Helvetica Neue",Helvetica,Inter,"Segoe UI",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
body.schematic{--page-ink:#141414;--page-dim:rgba(20,20,20,.55);--lead:#141414}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:var(--sans);-webkit-font-smoothing:antialiased}
canvas#stage{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#stage:active{cursor:grabbing}
#flash{position:fixed;inset:0;pointer-events:none;background:#f4f2ec;opacity:0;transition:opacity .45s ease}

#mark{position:fixed;top:26px;left:30px;display:flex;flex-direction:column;gap:9px;color:var(--page-ink);user-select:none;pointer-events:none;z-index:3}
#mark .top{display:flex;align-items:flex-start;gap:12px}
#mark .w{font-size:15px;font-weight:300;letter-spacing:.52em;text-transform:uppercase;line-height:1;padding-top:1px}
#mark .ix{pointer-events:auto;text-decoration:none;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--accent);border:1px solid rgba(200,168,119,.4);padding:2px 4px 1px;line-height:1}
#mark .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.20em;text-transform:uppercase;color:var(--page-dim)}
#hud{position:fixed;left:30px;bottom:22px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--page-dim);user-select:none;z-index:3}
#hud b{color:var(--accent);font-weight:400}
#readout{position:fixed;left:30px;bottom:46px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--page-ink);opacity:.8;z-index:3;font-variant-numeric:tabular-nums}

/* callouts */
#leaders{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#leaders path{fill:none;stroke:var(--lead);stroke-width:1}
#leaders circle{fill:var(--lead)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2}
.co{position:absolute;left:0;top:0;white-space:nowrap;font-size:13px;letter-spacing:.01em;color:var(--page-ink);line-height:1;will-change:transform,opacity;opacity:0}
body:not(.schematic) .co{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase}

/* title block (schematic only) */
#titleblock{position:fixed;right:30px;bottom:22px;z-index:3;display:none;border:1.5px solid #141414;font-family:var(--sans);color:#141414;background:rgba(244,242,236,.85)}
body.schematic #titleblock{display:grid;grid-template-columns:auto auto auto}
#titleblock div{padding:6px 10px;border-right:1px solid #141414;border-bottom:1px solid #141414}
#titleblock div:nth-child(3n){border-right:0}
#titleblock div:nth-last-child(-n+3){border-bottom:0}
#titleblock small{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.6;margin-bottom:3px}
#titleblock span{font-size:11px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
body.schematic #readout{display:none}
body.panel-open #titleblock{right:382px}

/* panel (Crucible house style) */
#panel-toggle{position:fixed;top:24px;right:30px;z-index:7;display:flex;align-items:center;gap:10px;background:rgba(12,13,16,.72);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border:1px solid var(--rule);color:#b9bcc0;font-family:var(--mono);font-size:9px;letter-spacing:.20em;text-transform:uppercase;padding:8px 11px;cursor:pointer;line-height:1;transition:border-color .3s,color .3s,opacity .35s}
#panel-toggle:hover{border-color:rgba(200,168,119,.45);color:var(--ink)}
#panel-toggle .bars{display:flex;flex-direction:column;gap:2.5px;width:11px}
#panel-toggle .bars i{display:block;height:1px;background:currentColor}
#panel-toggle .bars i:nth-child(2){width:7px}
#panel-toggle .bars i:nth-child(3){width:9px}
#panel-toggle .key{color:var(--accent);border:1px solid rgba(200,168,119,.28);padding:2px 4px 1px;font-size:8px;letter-spacing:.06em}
body.panel-open #panel-toggle{opacity:0;pointer-events:none}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(352px,92vw);z-index:8;display:flex;flex-direction:column;background:rgba(9,10,12,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-left:1px solid var(--rule);color:var(--ink);transform:translateX(101%);transition:transform .52s cubic-bezier(.4,0,.2,1);will-change:transform}
body.panel-open #panel{transform:translateX(0)}
#panel header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:24px 22px 16px;border-bottom:1px solid var(--rule)}
#panel header .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.20em;text-transform:uppercase;color:var(--faint)}
#panel header h2{margin:8px 0 0;font-size:13px;font-weight:300;letter-spacing:.34em;text-transform:uppercase}
#panel-close{background:none;border:1px solid var(--rule);color:var(--dim);width:24px;height:24px;line-height:1;cursor:pointer;font-size:14px}
#panel-close:hover{border-color:rgba(200,168,119,.45);color:var(--ink)}
#panel .body{overflow-y:auto;overscroll-behavior:contain;padding:0 22px 26px;flex:1 1 auto}
#panel .body::-webkit-scrollbar{width:6px}
#panel .body::-webkit-scrollbar-thumb{background:rgba(232,227,216,.12)}
#panel section{padding:20px 0 8px;border-bottom:1px solid var(--rule-2)}
#panel section:last-of-type{border-bottom:0}
#panel h3{margin:0 0 4px;font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);font-weight:400;display:flex;justify-content:space-between}
#panel h3 .ix{color:rgba(200,168,119,.5)}
#panel .note{margin:12px 0 2px;font-family:var(--mono);font-size:8.5px;line-height:1.85;letter-spacing:.05em;color:var(--faint)}
.sld{display:block;margin:13px 0 0}
.sld .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.sld .row output{color:var(--dim);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.sld input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:12px;background:none;cursor:pointer;display:block;margin:0}
.sld input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--rule)}
.sld input[type=range]::-moz-range-track{height:1px;background:var(--rule)}
.sld input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;margin-top:-4px;background:var(--accent);border:0;border-radius:0;transform:rotate(45deg)}
.sld input[type=range]::-moz-range-thumb{width:8px;height:8px;background:var(--accent);border:0;border-radius:0}
.sld input[type=range]:focus{outline:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:13px}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opts button{text-align:left;background:rgba(232,227,216,.028);border:1px solid var(--rule-2);color:var(--dim);cursor:pointer;padding:8px 9px 7px;line-height:1.3;transition:border-color .25s,color .25s,background .25s}
.opts button b{display:block;font-family:var(--sans);font-size:11px;font-weight:400;letter-spacing:.06em}
.opts button i{display:block;font-style:normal;font-family:var(--mono);font-size:7.5px;letter-spacing:.09em;color:var(--faint);margin-top:3px}
.opts button:hover{border-color:rgba(200,168,119,.34);color:var(--ink)}
.opts button[aria-pressed="true"]{border-color:rgba(200,168,119,.62);background:rgba(200,168,119,.09);color:var(--ink)}
.opts button[aria-pressed="true"] i{color:var(--accent)}
.act{display:block;width:100%;margin-top:14px;background:none;border:1px solid var(--rule);color:var(--dim);cursor:pointer;font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;padding:9px 8px 8px;transition:border-color .25s,color .25s,background .25s}
.act:hover{border-color:rgba(200,168,119,.45);color:var(--ink);background:rgba(200,168,119,.05)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:700px){#mark{top:18px;left:16px}#hud{left:16px;right:16px;bottom:14px;font-size:8px}#readout{left:16px}#panel-toggle{top:16px;right:16px}#titleblock{display:none!important}}
</style>
</head>
