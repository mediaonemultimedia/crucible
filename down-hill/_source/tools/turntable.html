<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Down Hill · Kart Turntable</title>
<style>
  :root { color-scheme: light; font-family: system-ui, sans-serif; color: #262521; background: #eeece7; }
  body { margin: 0; }
  main { max-width: 1500px; margin: auto; padding: clamp(18px, 4vw, 56px); }
  header { display: flex; align-items: end; justify-content: space-between; flex-wrap: wrap; gap: 18px; margin-bottom: 25px; }
  h1 { font-family: Georgia, serif; font-size: clamp(32px, 5vw, 66px); font-weight: 400; letter-spacing: -.045em; margin: 0; }
  button { font: inherit; font-size: 12px; font-weight: 750; letter-spacing: .08em; border: 1px solid #a49f96; background: transparent; color: inherit; padding: 9px 18px; cursor: pointer; }
  button[aria-pressed="true"] { background: #282722; color: #fff; border-color: #282722; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; }
  .sheet { position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 1050px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 780px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 525px) { .cards { grid-template-columns: 1fr; } }
  article { min-width: 0; }
  .view { aspect-ratio: 1; background: #e6e3dd; }
  .caption { padding: 14px 0 10px; }
  h2 { margin: 0; font: 26px Georgia, serif; }
  .driver { margin: 4px 0 16px; color: #514e47; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 5px 8px; }
  th:first-child { text-align: left; padding-left: 0; }
  [data-look="new"] .new, [data-look="old"] .old { background: #dfdbd2; }
  #status { color: #514e47; font-size: 13px; }
</style>
<script type="importmap">
{
  "imports": {
    "three/webgpu": "../node_modules/three/build/three.webgpu.js",
    "three/tsl": "../node_modules/three/build/three.tsl.js"
  }
}
</script>
</head>
<body>
<main data-look="new">
  <header>
    <h1>Down Hill Kart Turntable</h1>
    <div class="controls" role="group" aria-label="Turntable controls">
      <button type="button" data-mode="old" aria-pressed="false" disabled>OLD</button>
      <button type="button" data-mode="new" aria-pressed="true" disabled>NEW</button>
      <button type="button" id="rotation" aria-pressed="true" disabled>ROTATE</button>
    </div>
  </header>
  <div class="comparison">
    <div class="sheet">
      <canvas aria-label="Seven Down Hill karts with their plush drivers"></canvas>
      <div class="cards"></div>
    </div>
  </div>
  <p id="status" role="status">Loading turntable…</p>
</main>
<script type="module">
import * as THREE from 'three/webgpu';
import { RacerView } from '../src/render/racer.js';
import { RACERS } from '../src/race/roster.js';
import { mat, mesh } from '../src/render/geo.js';
import { LOOKDEV_KARTS, buildLookdevKart, driverStances } from '../src/render/lookdev-karts.js';

function lights(scene) {
  scene.add(new THREE.HemisphereLight('#fff7e9', '#a2a1a0', 2.1));
  for (const [color, intensity, x, y, z] of [
    ['#fff2df', 2.2, -4, 7, 5], ['#e6eeff', 1.3, 5, 3, -5]
  ]) {
    const light = new THREE.DirectionalLight(color, intensity);
    light.position.set(x, y, z);
    scene.add(light);
  }
}

async function start() {
  const canvas = document.querySelector('canvas');
  const renderer = new THREE.WebGPURenderer({ canvas, alpha: true, antialias: true, forceWebGL: true });
  await renderer.init();
  renderer.setClearColor('#e6e3dd');
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.autoClear = false;
  const camera = new THREE.OrthographicCamera(-3.6, 3.6, 3.6, -3.6, 0.1, 40);
  camera.position.set(0, 5.6, 11);
  camera.lookAt(0, 1.55, 0);
  const target = new THREE.RenderTarget(256, 256);
  const cards = document.querySelector('.cards');
  const stages = LOOKDEV_KARTS.map((spec) => {
    const racer = RACERS[spec.id];
    const scene = new THREE.Scene();
    lights(scene);
    const old = new RacerView(scene, spec.id, false);
    // Measure the vehicle alone; the seated plush can extend beyond its bodywork.
    old.driver.root.removeFromParent();
    const model = buildLookdevKart(racer.kart, false, old.kart);
    old.kart.seat.add(old.driver.root);
    const root = new THREE.Group();
    scene.add(root);
    root.add(old.group, model.group);
    old.driver.light(camera.quaternion);
    const driver = old.driver.root;
    model.seat.add(driver);
    const newPose = model.plush;
    driver.scale.setScalar(newPose.scale);
    driver.position.set(0, newPose.y, newPose.z);
    const poseDriver = driverStances(old.driver, model.body);

    const article = document.createElement('article');
    article.innerHTML = `
      <div class="view" aria-hidden="true"></div>
      <div class="caption"><h2>${racer.kartName}</h2><p class="driver">${racer.name}</p>
      <table aria-label="${racer.kartName} render cost">
        <thead><tr><th scope="col">Per kart + driver</th><th scope="col" class="old">OLD</th><th scope="col" class="new">NEW</th></tr></thead>
        <tbody><tr><th scope="row">Draw calls</th><td class="old"></td><td class="new"></td></tr>
        <tr><th scope="row">Triangles</th><td class="old"></td><td class="new"></td></tr></tbody>
      </table></div>`;
    cards.append(article);
    function setLook(mode) {
      const isNew = mode === 'new';
      old.group.visible = !isNew;
      model.group.visible = isNew;
      (isNew ? model.seat : old.kart.seat).add(old.driver.root);
      const pose = isNew ? newPose : old.kart.plush;
      old.driver.root.scale.setScalar(pose.scale);
      old.driver.root.position.set(0, pose.y, pose.z);
      poseDriver(isNew);
    }
    root.rotation.y = -1.02;
    for (const mode of ['old', 'new']) {
      setLook(mode);
      renderer.setRenderTarget(target);
      renderer.clear();
      renderer.info.reset();
      renderer.render(scene, camera);
      const { drawCalls, triangles } = renderer.info.render;
      const cells = article.querySelectorAll(`tbody .${mode}`);
      cells[0].textContent = drawCalls.toLocaleString('en');
      cells[1].textContent = triangles.toLocaleString('en');
    }
    // The studio base is outside the measured render.
    mesh(new THREE.CylinderGeometry(2.87, 2.91, 0.12, 64), mat('#c9c5bd'), 0, -0.07, 0, scene);
    return { scene, root, setLook, view: article.querySelector('.view') };
  });
  renderer.setRenderTarget(null);
  target.dispose();

  const main = document.querySelector('main');
  const modes = [...document.querySelectorAll('[data-mode]')];
  const rotation = document.querySelector('#rotation');
  let spinning = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let angle = -1.02;
  let previous;
  let needsRender = true;
  for (const button of modes) {
    button.disabled = false;
    button.addEventListener('click', () => {
      needsRender = true;
      main.dataset.look = button.dataset.mode;
      for (const stage of stages) stage.setLook(button.dataset.mode);
      for (const mode of modes) mode.setAttribute('aria-pressed', String(mode === button));
    });
  }
  rotation.disabled = false;
  rotation.setAttribute('aria-pressed', String(spinning));
  rotation.addEventListener('click', () => {
    spinning = !spinning;
    rotation.setAttribute('aria-pressed', String(spinning));
  });

  const resize = () => {
    needsRender = true;
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
  };
  new ResizeObserver(resize).observe(canvas);
  window.addEventListener('scroll', () => { needsRender = true; }, { passive: true });
  resize();
  document.querySelector('#status').textContent = 'Counts come from one isolated render per kart, including the plush driver.';
  renderer.setAnimationLoop((now) => {
    if (spinning && previous !== undefined) angle += Math.min((now - previous) / 1000, 0.05) * 0.26;
    previous = now;
    if (!spinning && !needsRender) return;
    needsRender = false;
    const bounds = canvas.getBoundingClientRect();
    renderer.setScissorTest(false);
    renderer.setClearAlpha(0);
    renderer.clear();
    renderer.setClearAlpha(1);
    renderer.setScissorTest(true);
    stages.forEach(({ scene, root, view }) => {
      root.rotation.y = angle;
      const rect = view.getBoundingClientRect();
      if (rect.bottom <= 0 || rect.top >= innerHeight) return;
      const left = Math.round(rect.left - bounds.left);
      const top = Math.round(rect.top - bounds.top);
      const size = Math.round(rect.width);
      renderer.setViewport(left, top, size, size);
      renderer.setScissor(left, top, size, size);
      renderer.clear();
      renderer.render(scene, camera);
    });
  });
}

start().catch((error) => {
  document.querySelector('#status').textContent = `Turntable failed to start. ${error.message}`;
  console.error(error);
});
</script>
</body>
</html>
